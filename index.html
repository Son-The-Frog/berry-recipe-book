<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1.0, initial-scale=1.0">
    <title>Son's Berry Recipe Book</title>	ext            <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Son's Berry Recipe Book</h1>
        
        <div class="recipe-form">
            <h3>Add a New Berry Recipe</h3>
            <input type="text" id="recipe-name" placeholder="Recipe Name">
            <textarea id="recipe-ingredients" placeholder="Ingredients (like berries and flies)" rows="3"></textarea>
            <input type "text" id="recipe-time" placeholder="Cooking Time (e.g. 10 mins)">
            <input type="number" id="recipe-flies" placeholder="Number of Flies needed">
            <select id="recipe-category">
                <option value="General">General</option>
                <option value="Foggy Day">Foggy Day</option>
            </select>
            <button onclick="addRecipe()">Add to Book</button>
        </div>

        <div class="search-container">
            <input type="text" id="recipe-search" placeholder="Search berries or ingredients..." oninput="filterRecipes()">
            <select id="category-filter" onchange="filterRecipes()">
                <option value="All">All Categories</option>
                <option value="General">General</option>
                <option value="Foggy Day">Foggy Day</option>
            </select>
            <button id="random-recipe-btn" onclick="pickRandomRecipe()">Random Recipe!</button>
            <button id="clear-filter-btn" onclick="clearFilters()">Clear Filters</button>
        category-container
        </div>

        <div id="no-results-message" style="display: none; text-align: center; color: #b22222; margin: 20px 0; font-style: italic;">
            No berry recipes found... maybe try a different search?
        </div>

        <div id="categories-container">
            <!-- Categories and their lists will be generated by JavaScript -->
        </div>

        <div class="shopping-list-section">
            <h3>My Berry Shopping List</h3>
            <div class="shopping-input-group">
                <input type="text" id="shopping-item-input" placeholder="Add an ingredient...">
                <button id="add-shopping-btn" onclick="addToShoppingList()">Add</button>
            </div>
            <ul id="shopping-list">
                <!-- Shopping items will be added here -->
            </ul>
            <button id="clear-shopping-btn" onclick="clearShoppingList()">Clear All</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
