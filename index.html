<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Son's Berry Recipe Book</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #fdf2f2;
            color: #4a4a4a;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            max-width: 600px;
            width: 100%;
            background: white;
            background-image: radial-gradient(#fff5f5 2px, transparent 2px);
            background-size: 20px 20px;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            border: 3px solid #d63384;
        }
        h1 {
            color: #d63384;
            text-align: center;
            border-bottom: 2px solid #f8d7da;
            padding-bottom: 10px;
            font-variant: small-caps;
        }
        .recipe-form {
            background: #fff5f5;
            padding: 15px;
            border-radius: 10px;
            border: 1px solid #f8d7da;
            margin-bottom: 20px;
        }
        .recipe-form input, .recipe-form textarea {
            width: 100%;
            box-sizing: border-box;
            padding: 10px;
            margin: 5px 0 15px 0;
            border: 1px solid #f8d7da;
            border-radius: 5px;
            font-family: inherit;
        }
        .recipe-form button {
            background-color: #d63384;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.2s;
        }
        .recipe-form button:hover {
            background-color: #b02a6b;
        }
        .recipe-list {
            list-style: none;
            padding: 0;
        }
        .recipe-item {
            background: #fff5f5;
            margin: 10px 0;
            padding: 15px;
            border-radius: 8px;
            border-left: 5px solid #d63384;
            cursor: pointer;
            transition: background 0.3s, transform 0.1s;
        }
        .recipe-item:hover {
            background: #ffebeb;
            transform: scale(1.01);
        }
        .recipe-details {
            display: none;
            padding: 10px 0 0 10px;
            color: #666;
            font-style: italic;
            border-top: 1px dashed #f8d7da;
            margin-top: 10px;
        }
        .recipe-item.active .recipe-details {
            display: block;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Son's Berry Recipe Book</h1>
        
        <div class="recipe-form">
            <h3>Add a New Berry Recipe</h3>
            <input type="text" id="recipe-name" placeholder="Recipe Name">
            <textarea id="recipe-ingredients" placeholder="Ingredients (like berries and flies)" rows="3"></textarea>
            <button onclick="addRecipe()">Add to Book</button>
        </div>

        <ul id="recipe-list" class="recipe-list">
            <!-- Default Recipes -->
            <li class="recipe-item" onclick="this.classList.toggle('active')">
                <strong>Honey Glazed Berry Berries</strong>
                <div class="recipe-details">Ingredients: Sweet honey, giant red berries, a pinch of sugar.</div>
            </li>
            <li class="recipe-item" onclick="this.classList.toggle('active')">
                <strong>Sunny-Day Berry Mix-up</strong>
                <div class="recipe-details">Ingredients: Lots of wild berries, and a whole bunch of flies! (I can't remember the exact number, but it's a lot).</div>
            </li>
        </ul>
    </div>

    <script>
        function addRecipe() {
            const nameInput = document.getElementById('recipe-name');
            const ingredientsInput = document.getElementById('recipe-ingredients');
            const list = document.getElementById('recipe-list');

            if (nameInput.value.trim() === "" || ingredientsInput.value.trim() === "") {
                alert("Please fill in both the name and ingredients!");
                return;
            }

            const li = document.createElement('li');
            li.className = 'recipe-item';
            li.onclick = function() { this.classList.toggle('active'); };
            
            li.innerHTML = `<strong>${nameInput.value}</strong><div class="recipe-details">Ingredients: ${ingredientsInput.value}</div>`;
            
            list.appendChild(li);
            
            nameInput.value = '';
            ingredientsInput.value = '';
        }
    </script>
</body>
</html>
