<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Son's Berry Recipe Book</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Son's Berry Recipe Book</h1>
        
        <div class="recipe-form">
            <h3>Add a New Berry Recipe</h3>
            <input type="text" id="recipe-name" placeholder="Recipe Name">
            <textarea id="recipe-ingredients" placeholder="Ingredients (like berries and flies)" rows="3"></textarea>
            <input type="text" id="recipe-time" placeholder="Cooking Time (e.g. 10 mins)">
            <input type="number" id="recipe-flies" placeholder="Number of Flies needed">
            <select id="recipe-category">
                <option value="General">General</option>
                <option value="Foggy Day">Foggy Day</option>
            </select>
            <button onclick="addRecipe()">Add to Book</button>
        </div>

        <div class="search-container">
            <input type="text" id="recipe-search" placeholder="Search berries or ingredients..." oninput="filterRecipes()">
            <button id="random-recipe-btn" onclick="pickRandomRecipe()">Random Recipe!</button>
        </div>

        <div id="categories-container">
            <!-- Categories and their lists will be generated by JavaScript -->
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
